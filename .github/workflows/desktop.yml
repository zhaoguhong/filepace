name: Desktop checks and installers
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_installers:
        description: Upload installer artifacts
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --only-shell chromium
      - run: npm run test:e2e
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --bundles ${{ matrix.bundles }}
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.upload_installers }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
      - name: Build installers and signed updates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_installers }}
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.FILEPACE_UPDATE_SIGNING_KEY }}
      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_installers }}
        with:
          name: Filepace-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
      - name: Verify installed Windows app
        if: ${{ runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.upload_installers }}
        shell: powershell
        run: ./tests/windows-installer-smoke.ps1
      - name: Verify Windows standard-user installation
        if: ${{ runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.upload_installers }}
        shell: powershell
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          ./tests/windows-standard-user-smoke.ps1 -Installer $installer.FullName

  first-windows-install:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_installers }}
    needs: desktop
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: Filepace-windows-latest
          path: installer
      - name: Verify Windows installation without WebView2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application"
          $setup = Get-ChildItem "$runtime\*\Installer\setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
              Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
              $null = Start-Process $setup.FullName -ArgumentList '--uninstall --msedgewebview --system-level --force-uninstall' -Wait -PassThru
              if (Get-ChildItem "$runtime\*\msedgewebview2.exe" -ErrorAction SilentlyContinue) {
                  throw 'The disposable runner still has a WebView2 executable'
              }
          }
          $installer = Get-ChildItem installer -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          ./tests/windows-standard-user-smoke.ps1 -Installer $installer.FullName -RequireEmptyRuntime
