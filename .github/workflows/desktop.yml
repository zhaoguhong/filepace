name: Desktop checks and installers
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_installers:
        description: Upload installer artifacts
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --only-shell chromium
      - run: npm run test:e2e
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --bundles ${{ matrix.bundles }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_installers }}
        with:
          name: Filepace-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
      - name: Verify installed Windows app
        if: ${{ runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.upload_installers }}
        shell: powershell
        run: ./tests/windows-installer-smoke.ps1
